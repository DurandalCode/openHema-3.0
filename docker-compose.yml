services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-hema}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hema} -d ${POSTGRES_DB:-hema}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый прогон goose-миграций всех модулей перед стартом сервера.
  # Goose хранит версию НА МОДУЛЬ (отдельная таблица), чтобы одинаково
  # названные 00001_init.sql в разных модулях не silent-skip'али друг друга.
  # Цикл по /app/modules/*/migrations соответствует `make migrate`.
  migrate:
    build:
      context: ./server
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        for d in /app/modules/*/migrations; do
          m=$$(basename "$$(dirname "$$d")")
          /app/goose -dir "$$d" -table "goose_db_version_$$m" postgres "$$DATABASE_URL" up
        done
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hema}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-hema}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ./server
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-hema}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-hema}?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-30m}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@hema-tournament.example}
      EMAIL_TOKEN_TTL: ${EMAIL_TOKEN_TTL:-24h}
      FILE_STORAGE_DIR: /app/data/files
      REGULATIONS_MAX_BYTES: ${REGULATIONS_MAX_BYTES:-10485760}
      EMBLEM_MAX_BYTES: ${EMBLEM_MAX_BYTES:-5242880}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-20}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      # BFF (сервис web) — единственный сетевой клиент сервера (ADR 0001) в
      # этом стеке, поэтому доверие к X-Forwarded-For здесь безопасно
      # включить явно (NFR-6 спеки 0042).
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
    volumes:
      # Локальный том файлового хранилища (регламент/эмблема турнира, ADR
      # 0019) — переживает пересборку и перезапуск контейнера.
      - files:/app/data/files
    # Порт наружу не публикуется: единственный сетевой клиент сервера —
    # BFF (web) внутри compose-сети (ADR 0001, FR-3 спеки 0048). Для
    # локального докер-прогона порт возвращает docker-compose.override.yml.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
    environment:
      SERVER_GRPC_URL: http://server:8080
      PORT: "3000"
    # Порт наружу не публикуется: снаружи стек обслуживает только `proxy`
    # (FR-3 спеки 0048). Для локального докер-прогона порт возвращает
    # docker-compose.override.yml.
    depends_on:
      - server

  # TLS-шлюз для публичного запуска (make deploy, спека 0048, профиль
  # prod — та же топология понадобится и боевому запуску, второго профиля
  # не заводим). Не поднимается обычным `docker compose up` без
  # `--profile prod`, чтобы локальный докер-прогон не требовал домена и
  # свободных 80/443 (FR-8/AC-6).
  proxy:
    image: caddy:2-alpine
    profiles: ["prod"]
    environment:
      # Не `${PUBLIC_DOMAIN:?...}` — интерполяция переменных в
      # docker-compose.yml выполняется для всех сервисов независимо от
      # профиля, обязательность без значения по умолчанию сломала бы
      # `make prod`/`make dev` даже без активации профиля prod (AC-6 спеки
      # 0048). Проверка обязательности — в самом Makefile-таргете `deploy`.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      # ACME_EMAIL опционален (.env.example) — но Caddyfile-директиве
      # `email` нужен ровно один аргумент, пустая строка ломает парсинг
      # Caddyfile (в отличие от compose, у плейсхолдера `{$VAR:default}` в
      # самом Caddy дефолт не подставляется для заданной, но пустой
      # переменной). Дефолт подставляем здесь, на уровне compose-
      # интерполяции (`:-`, срабатывает и на unset, и на пустую строку).
      ACME_EMAIL: ${ACME_EMAIL:-admin@${PUBLIC_DOMAIN:-example.invalid}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и состояние ACME переживают рестарт/передеплой (NFR-3
      # спеки 0048) — не упираемся в лимиты запросов Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - server

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:

# Compose подключает этот файл автоматически при обычном `docker compose
# up` (без явного `-f`), поэтому `make dev`/`make prod` продолжают работать
# буквально как до спеки 0048: прямые порты, без домена, без прокси (профиль
# `prod` не активируется без явного `--profile`). Публичный запуск
# (`make deploy`) исключает этот файл явным `-f docker-compose.yml`.
services:
  server:
    ports:
      - "8080:8080"
  web:
    ports:
      - "${WEB_PORT:-3000}:3000"

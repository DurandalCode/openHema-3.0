syntax = "proto3";

package hema.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/hema/server/gen/hema/v1;hemav1";

// StageAdminService — управление раскладкой бойцов номинации по пулам
// (группам). Все RPC требуют роль ADMIN (проверяется серверным
// интерсептором RequireAdmin). Публичного чтения нет (спека 0009, FR-13):
// пулы — служебная раскладка организатора.
service StageAdminService {
  // ListStages возвращает этапы номинации (спека 0018, FR-18). Материализует
  // групповой этап, если строки ещё нет (0017, FR-4) — единственное место,
  // где виртуальный этап получает постоянный id.
  rpc ListStages(ListStagesRequest) returns (ListStagesResponse);
  // ListStagesForTournament возвращает схему этапов + диагностику (как
  // ListStages) для всех номинаций турнира одним обращением (спека 0041,
  // FR-8) — вместо одного запроса на номинацию у экрана списка номинаций
  // (0028, NFR-2). Охват — NominationProvider.NominationsByTournament (тот
  // же, что у GetTournamentLive, спека 0034). Холодные данные, без живого
  // опроса (спека 0041, FR-10).
  rpc ListStagesForTournament(ListStagesForTournamentRequest) returns (ListStagesForTournamentResponse);
  // CreateStage добавляет номинации новый этап — сетку (спека 0018, FR-2)
  // либо групповой этап (спека 0019, FR-7): параметры (размер сетки/бой за
  // 3-е место, либо число групп) задаются один раз и не редактируются
  // (0018, FR-4), кроме правила отбора (см. SetStageRule). Новый этап
  // встаёт следующим по порядку, либо — если сразу передано правило с
  // источником-этапом — параллельной веткой на позиции источника (спека
  // 0019, FR-10). Авто-этап (0017, FR-4) этим RPC не создаётся.
  rpc CreateStage(CreateStageRequest) returns (CreateStageResponse);
  // DeleteStage удаляет явно созданный этап, пока в нём не начат ни один бой
  // (0018, FR-3) и пока на него не ссылается правило другого этапа как на
  // источник (спека 0019, FR-7a). Авто-этап удалить нельзя.
  rpc DeleteStage(DeleteStageRequest) returns (DeleteStageResponse);
  // SetStageRule задаёт или снимает правило отбора этапа (спека 0019, FR-1/
  // FR-6): источник (ростер номинации либо другой групповой этап той же
  // номинации, стоящий раньше по порядку), селектор (все/места X-Y каждой
  // группы/места X-Y сводного порядка) и производный от типа целевого
  // этапа метод раскладки. Разрешено только пока состав этапа пуст.
  rpc SetStageRule(SetStageRuleRequest) returns (SetStageRuleResponse);
  // PreviewStageBuild считает, кто будет отобран текущим правилом этапа, и
  // куда каждый попадёт, без применения (спека 0019, FR-15): показывает
  // происхождение каждого бойца, вместимость, пересечение с параллельными
  // ветками (FR-11), незакрытые дележи мест (FR-22) и предупреждение о
  // недоигранном источнике (FR-14). ties — ответы организатора на дележи,
  // уже разрешённые в предыдущем вызове превью того же формирования;
  // не персистируется (FR-24).
  rpc PreviewStageBuild(PreviewStageBuildRequest) returns (PreviewStageBuildResponse);
  // BuildStage применяет план последнего PreviewStageBuild (спека 0019,
  // FR-16): заполняет состав этапа (группы — автораспределением, сетку —
  // посевом), оставляя этап в черновике. Отклоняется, если состав уже не
  // пуст (FR-18, сначала ResetLayout), есть пересечение с параллельными
  // ветками (FR-11), превышена вместимость (FR-19) или остались
  // неразрешённые дележи (FR-22, ties должны закрыть их все).
  rpc BuildStage(BuildStageRequest) returns (BuildStageResponse);
  // GetBracket возвращает админский вид сетки: дерево слотов, разрешённое
  // из посева и материализованных боёв (FR-7/FR-19), плюс кого ещё можно
  // посеять. Чтение — без материализации боёв.
  rpc GetBracket(GetBracketRequest) returns (GetBracketResponse);
  // SeedBracketSlot сажает бойца в слот первого круга (FR-7/FR-8): занятый
  // слот и уже посеянный боец — обмен местами; занятый слот и новый боец —
  // отказ. Только в draft.
  rpc SeedBracketSlot(SeedBracketSlotRequest) returns (SeedBracketSlotResponse);
  // ClearBracketSlot освобождает слот (FR-8). Идемпотентно. Только в draft.
  rpc ClearBracketSlot(ClearBracketSlotRequest) returns (ClearBracketSlotResponse);
  // GetLayout возвращает текущую раскладку этапа (спека 0018, FR-18 —
  // адресация переехала с номинации на этап): статус, список
  // нераспределённых бойцов и список пулов с их бойцами (lazy-init —
  // отсутствие раскладки трактуется как draft с пустыми пулами, FR-14).
  rpc GetLayout(GetLayoutRequest) returns (GetLayoutResponse);
  // CreatePool создаёт пул в этапе. Имя генерируется системой как
  // «Пул N», где N — наименьший свободный положительный номер (FR-3).
  // Только в draft группового этапа — на сетке отклоняется (спека 0018).
  rpc CreatePool(CreatePoolRequest) returns (CreatePoolResponse);
  // DeletePool удаляет пул; все его бойцы возвращаются в нераспределённые
  // (FR-4). Undoable. Только в draft.
  rpc DeletePool(DeletePoolRequest) returns (DeletePoolResponse);
  // ResetLayout удаляет все пулы этапа разом и возвращает всех бойцов
  // в нераспределённые, статус остаётся draft (FR-4a). Только в draft.
  rpc ResetLayout(ResetLayoutRequest) returns (ResetLayoutResponse);
  // AssignFighter перемещает бойца в пул: из нераспределённых либо из
  // другого пула (move одним действием, FR-5). Только в draft.
  rpc AssignFighter(AssignFighterRequest) returns (AssignFighterResponse);
  // UnassignFighter возвращает бойца из пула в нераспределённые (FR-5).
  // Только в draft.
  rpc UnassignFighter(UnassignFighterRequest) returns (UnassignFighterResponse);
  // AutoDistribute раскладывает всех нераспределённых бойцов по
  // существующим пулам, минимизируя одноклубников в одном пуле (FR-6/FR-7).
  // Уже расставленные бойцы не трогаются. Undoable. Только в draft.
  rpc AutoDistribute(AutoDistributeRequest) returns (AutoDistributeResponse);
  // Undo откатывает последнее mutating-действие среди двух классов:
  // автораспределение или удаление пула (FR-7a). Только в draft.
  rpc Undo(UndoRequest) returns (UndoResponse);
  // SetLayoutStatus переключает статус раскладки draft↔ready (FR-9, спека
  // 0009). draft→ready фиксирует состав и формирует бои всех пулов этапа
  // (спека 0010; на сетке — FR-9/FR-10/FR-11 спеки 0018); ready→draft
  // отклоняется, если хотя бы один пул этапа стоит на арене (спека 0011,
  // FR-3; спека 0017 FR-8 — в пределах этапа).
  rpc SetLayoutStatus(SetLayoutStatusRequest) returns (SetLayoutStatusResponse);
  // SeatPoolOnArena ставит готовый пул (PoolStatus READY) на активную
  // свободную площадку целиком, вместе с его боями (спека 0011, FR-7).
  // Пул переходит в PREPARING. Отклоняется, если пул не готов, уже стоит на
  // арене, либо арена занята/архивна/не найдена.
  rpc SeatPoolOnArena(SeatPoolOnArenaRequest) returns (SeatPoolOnArenaResponse);
  // UnseatPool снимает пул с арены: привязка к площадке очищается, площадка
  // освобождается. Разрешено в любой исполнительной фазе пула — PREPARING,
  // ACTIVE и FINISHED (спека 0013, FR-11: результаты уже проведённых боёв
  // сохраняются, статус пула не сбрасывается). PoolStatus после снятия
  // вычисляется из прогресса боёв (READY, если ни один бой не начат, иначе
  // ACTIVE/FINISHED как было).
  rpc UnseatPool(UnseatPoolRequest) returns (UnseatPoolResponse);
  // GetPoolsForArena возвращает для страницы конкретной арены (спека 0011,
  // FR-9): пул, который сейчас на ней стоит (если есть), и список готовых
  // пулов, доступных для постановки (PoolStatus READY, ни на одной арене).
  rpc GetPoolsForArena(GetPoolsForArenaRequest) returns (GetPoolsForArenaResponse);
  // GetBoutBoard возвращает доску ведения боёв арены (спека 0013, FR-14):
  // стоящий на арене пул, его бои по порядку (0010) и текущий бой. board
  // не заполнен, если на арене никто не стоит.
  rpc GetBoutBoard(GetBoutBoardRequest) returns (GetBoutBoardResponse);
  // GetArenaBoards возвращает доску ведения боёв (как GetBoutBoard) для всех
  // неархивных площадок турнира одним обращением (спека 0041, FR-7) —
  // вместо одного запроса на площадку за цикл обновления у доски площадок
  // (0027, NFR-3). Охват — ArenaProvider.ActiveArenas (тот же, что у
  // GetTournamentLive, спека 0034). Частота обновления не меняется (спека
  // 0041, FR-9) — меняется число обращений за цикл.
  rpc GetArenaBoards(GetArenaBoardsRequest) returns (GetArenaBoardsResponse);
  // GetArenaJournal возвращает журнал боёв пула, стоящего на площадке
  // (спека 0033, FR-33): начат/введён счёт/завершён/переоткрыт/сброшен,
  // новыми записями вперёд. Читает существующий event-sourced журнал боя
  // (спека 0013, ADR 0011), который до этой спеки не отдавался наружу ни
  // одним RPC. Пустой список, если на арене никто не стоит — не ошибка.
  // scheduled (формирование пар, спека 0010) в выдаче отсутствует — у него
  // нет человека-инициатора (FR-34/FR-36).
  rpc GetArenaJournal(GetArenaJournalRequest) returns (GetArenaJournalResponse);
  // SetCurrentBout назначает текущим любой бой пула — циркуляция (спека
  // 0013, FR-8), включая уже завершённые бои.
  rpc SetCurrentBout(SetCurrentBoutRequest) returns (SetCurrentBoutResponse);
  // StartCurrentBout переводит текущий бой пула не начат → идёт (спека
  // 0013, FR-4). Пул должен стоять на арене (FR-12).
  rpc StartCurrentBout(StartCurrentBoutRequest) returns (StartCurrentBoutResponse);
  // ScoreCurrentBout задаёт счёт текущего боя (абсолютное значение — быстрые
  // шаги ±1/±2/±3/±5 и ручной ввод считаются на клиенте, спека 0013,
  // FR-2/FR-2a). Допустимо только пока бой идёт.
  rpc ScoreCurrentBout(ScoreCurrentBoutRequest) returns (ScoreCurrentBoutResponse);
  // FinishCurrentBout переводит текущий бой идёт → завершён, фиксируя счёт
  // (спека 0013, FR-5); текущий бой пула автоматически продвигается на
  // следующий непроведённый (FR-9).
  rpc FinishCurrentBout(FinishCurrentBoutRequest) returns (FinishCurrentBoutResponse);
  // ReopenCurrentBout переводит текущий бой завершён → идёт для правки
  // счёта (спека 0013, FR-6).
  rpc ReopenCurrentBout(ReopenCurrentBoutRequest) returns (ReopenCurrentBoutResponse);
  // ResetCurrentBout переводит текущий бой идёт → не начат, счёт обнуляется
  // (спека 0013, FR-6).
  rpc ResetCurrentBout(ResetCurrentBoutRequest) returns (ResetCurrentBoutResponse);
  // WatchArenaBoard — живой канал табло арены (спека 0015, FR-1..FR-5/FR-14/
  // FR-18): первый кадр — текущий снапшот (доска + таймер + комната), далее
  // по одному кадру на изменение доски/таймера/состава комнаты/swap. Также
  // ретранслирует команды панели авторитетному табло (oneof command).
  // Admin-only (FR-1); поток завершается по отмене контекста клиентом.
  rpc WatchArenaBoard(WatchArenaBoardRequest) returns (stream WatchArenaBoardResponse);
  // PublishTimerFrame — авторитетное табло (комнаты арены, ordinal 1)
  // публикует текущее полное состояние таймера (спека 0015, решение
  // «источник — табло, синхроним полное время»). Сервер — реле: не считает
  // таймер сам, только кеширует и ретранслирует. Отклоняется, если вызывающий
  // не источник (не первое подключённое табло).
  rpc PublishTimerFrame(PublishTimerFrameRequest) returns (PublishTimerFrameResponse);
  // ControlArenaTimer — панель отправляет команду управления таймером
  // (пуск/пауза/сброс/±секунды, спека 0015 FR-7); сервер ретранслирует её
  // авторитетному табло через WatchArenaBoard (oneof command), само значение
  // таймера не меняет.
  rpc ControlArenaTimer(ControlArenaTimerRequest) returns (ControlArenaTimerResponse);
  // SetScoreboardSides — эфемерный swap синий/красный (спека 0015, FR-6): не
  // запоминается за боём, меняет только отображение комнаты арены.
  rpc SetScoreboardSides(SetScoreboardSidesRequest) returns (SetScoreboardSidesResponse);
  // RevealCurrentBout — секретарь явно показывает на всех подключённых
  // табло текущий бой пула (спека 0015, UX-уточнение): развязывает
  // «оглашение результата» (FinishCurrentBout, держит на табло прошлый бой
  // с исходом) и «переход к следующему бою на табло» на разные действия
  // панели. Домен не трогает — это чисто отображенческий сигнал: сервер
  // инкрементирует эфемерный счётчик комнаты арены (room.reveal_generation)
  // и рассылает его всем подключённым табло; получив новое значение,
  // табло снимает удержание и показывает board.current_bout_id как есть
  // (0:0, «не начат», если бой ещё не начат) — независимо от состояния
  // прежнего отображаемого боя. No-op, если у арены сейчас нет комнаты.
  rpc RevealCurrentBout(RevealCurrentBoutRequest) returns (RevealCurrentBoutResponse);
  // UpdateStage правит название и конфиг уже созданного этапа (спека 0020,
  // FR-2): название — всегда, конфиг (bracket/groups) и правило отбора —
  // только пока состав этапа пуст и этап в draft. Тип этапа не передаётся —
  // сменить его нечем (AC-3). Позиций не меняет — соседние этапы не
  // затрагиваются.
  rpc UpdateStage(UpdateStageRequest) returns (UpdateStageResponse);
  // ListFormatPresets возвращает библиотеку пресетов формата целиком (спека
  // 0020, FR-12) — глобальную, вне турнира и номинации.
  rpc ListFormatPresets(ListFormatPresetsRequest) returns (ListFormatPresetsResponse);
  // SaveFormatPreset сохраняет схему указанной номинации как именованный
  // пресет (спека 0020, FR-11/FR-12): отпечаток схемы на момент вызова
  // (копия по значению, FR-16), не живая ссылка. Имя обязано быть уникальным
  // без учёта регистра (AC-17).
  rpc SaveFormatPreset(SaveFormatPresetRequest) returns (SaveFormatPresetResponse);
  // RenameFormatPreset переименовывает пресет, не трогая его схему и уже
  // применённые к номинациям копии (спека 0020, FR-12/FR-16).
  rpc RenameFormatPreset(RenameFormatPresetRequest) returns (RenameFormatPresetResponse);
  // DeleteFormatPreset удаляет пресет из библиотеки; на номинации, к которым
  // он уже применялся, не влияет (спека 0020, FR-16).
  rpc DeleteFormatPreset(DeleteFormatPresetRequest) returns (DeleteFormatPresetResponse);
  // ApplyFormat заменяет схему номинации целиком — источником спецификации
  // служит либо пресет библиотеки, либо схема другой номинации (спека 0020,
  // FR-13/FR-15, копирование — тот же путь). Разрешено, только если текущая
  // схема номинации не тронута: нет состава, нет пулов на аренах, нет
  // начатых боёв (FR-13, FR-14) — иначе ErrSchemaNotEmpty. Атомарно (NFR-1).
  rpc ApplyFormat(ApplyFormatRequest) returns (ApplyFormatResponse);
}

// StagePublicService — публичное чтение пулов номинации (спека 0011, FR-11).
// Не требует роли ADMIN. Показывает пулы только при готовой (ready)
// раскладке номинации; пока раскладка draft — пустой список.
service StagePublicService {
  // ListPublicPools возвращает пулы номинации с составом (имя/клуб бойцов),
  // статусом и, если пул на арене — площадкой (спека 0011, FR-11/FR-12).
  rpc ListPublicPools(ListPublicPoolsRequest) returns (ListPublicPoolsResponse);
  // GetNominationLive возвращает живой снапшот номинации (спека 0014, FR-1..
  // FR-4): пулы готовой раскладки с исполнительным статусом/площадкой и их
  // бои с состоянием/счётом/текущим боём. Пустой список пулов, пока
  // раскладка draft (FR-12, как ListPublicPools). Используется для
  // SSR-инициала и polling-fallback (NFR-2).
  rpc GetNominationLive(GetNominationLiveRequest) returns (GetNominationLiveResponse);
  // WatchNominationLive — server-streaming живой канал (спека 0014, FR-6/
  // FR-8): первый кадр — текущий снапшот (как GetNominationLive), далее по
  // одному кадру на каждое изменение номинации (пул/бой). Односторонний,
  // read-only (FR-7); поток завершается по отмене контекста клиентом.
  rpc WatchNominationLive(WatchNominationLiveRequest) returns (stream WatchNominationLiveResponse);
  // GetNominationResults возвращает итоговый протокол номинации (спека 0021,
  // FR-9..FR-15). Отдельно от GetNominationLive — для экранов, которым нужны
  // только итоги (админский экран схемы, FR-19).
  rpc GetNominationResults(GetNominationResultsRequest) returns (GetNominationResultsResponse);
  // GetTournamentLive возвращает живую сводку турнира целиком для публичной
  // главной (спека 0034, FR-12..FR-22): площадки с их текущим состоянием,
  // ленту боёв всех номинаций и список номинаций с исполнительной фазой.
  // Одна сводка вместо N подписок по номинациям (браузерный лимит
  // соединений, FR-19/NFR-2) и единственный публичный источник состояния
  // площадок (ArenaAdminService — admin-only). Используется для SSR-инициала
  // и polling-fallback, как GetNominationLive.
  rpc GetTournamentLive(GetTournamentLiveRequest) returns (GetTournamentLiveResponse);
  // WatchTournamentLive — server-streaming живой канал сводки турнира (спека
  // 0034, FR-19): первый кадр — текущий снапшот (как GetTournamentLive),
  // далее по одному кадру на изменение любой номинации турнира.
  // Односторонний, read-only; поток завершается по отмене контекста
  // клиентом.
  rpc WatchTournamentLive(WatchTournamentLiveRequest) returns (stream WatchTournamentLiveResponse);
}

// PoolLayoutStatus — статус раскладки номинации целиком (спека 0009).
// Реализованы переходы только draft↔ready. Значения 3 (ACTIVE) и
// 4 (FINISHED) существовали как задел под будущие бои и упразднены спекой
// 0011: исполнительная фаза (готовится к запуску/идёт/завершён) — свойство
// отдельного пула (см. PoolStatus), не раскладки целиком.
enum PoolLayoutStatus {
  POOL_LAYOUT_STATUS_UNSPECIFIED = 0;
  POOL_LAYOUT_STATUS_DRAFT = 1;
  POOL_LAYOUT_STATUS_READY = 2;
  reserved 3, 4;
  reserved "POOL_LAYOUT_STATUS_ACTIVE", "POOL_LAYOUT_STATUS_FINISHED";
}

// PoolStatus — статус отдельного пула (спека 0011, FR-1). NOT_READY/READY
// синхронны со статусом раскладки номинации (переходят вместе при
// SetLayoutStatus); PREPARING — пул поставлен на арену (SeatPoolOnArena).
// ACTIVE/FINISHED — задел под будущий ЖЦ боя (ЕДД), переходы в них в этом
// инкременте не реализованы.
enum PoolStatus {
  POOL_STATUS_UNSPECIFIED = 0;
  POOL_STATUS_NOT_READY = 1;
  POOL_STATUS_READY = 2;
  POOL_STATUS_PREPARING = 3;
  POOL_STATUS_ACTIVE = 4;
  POOL_STATUS_FINISHED = 5;
}

// BoutState — состояние отдельного боя (спека 0013, FR-1). Все переходы
// обратимы: не начат ⇄ идёт ⇄ завершён.
enum BoutState {
  BOUT_STATE_UNSPECIFIED = 0;
  BOUT_STATE_NOT_STARTED = 1;
  BOUT_STATE_IN_PROGRESS = 2;
  BOUT_STATE_FINISHED = 3;
}

// StageType — тип этапа номинации (ADR 0014 §1/§3). GROUPS — круговая
// система внутри групп (0009/0010/0016). BRACKET — сетка на выбывание со
// вручную посеянными слотами (спека 0018).
enum StageType {
  STAGE_TYPE_UNSPECIFIED = 0;
  STAGE_TYPE_GROUPS = 1;
  STAGE_TYPE_BRACKET = 2;
}

// StageStatus — статус этапа целиком (спека 0021, FR-1; ADR 0014 §2):
// draft/ready — хранимая фиксация состава (0017, совпадает по значениям с
// PoolLayoutStatus), active/finished — вычисляются из прогресса боёв этапа,
// как PoolStatus у контейнера (0011/0013). Read-only: клиент не присылает
// это значение, оно приходит только в ответах.
enum StageStatus {
  STAGE_STATUS_UNSPECIFIED = 0;
  STAGE_STATUS_DRAFT = 1;
  STAGE_STATUS_READY = 2;
  STAGE_STATUS_ACTIVE = 3;
  STAGE_STATUS_FINISHED = 4;
}

// StageSourceKind — источник правила отбора этапа (спека 0019, FR-2).
// ROSTER — активный ростер номинации (питает первый этап); STAGE —
// конкретный другой групповой этап той же номинации, стоящий раньше по
// порядку. UNSPECIFIED в Stage.rule.source_kind означает «правила нет»
// (FR-1) — SeedingRule целиком отсутствует по смыслу, не просто пуст.
enum StageSourceKind {
  STAGE_SOURCE_KIND_UNSPECIFIED = 0;
  STAGE_SOURCE_KIND_ROSTER = 1;
  STAGE_SOURCE_KIND_STAGE = 2;
}

// StageSelectorKind — кого из источника берём (спека 0019, FR-3). ALL —
// все участники источника (единственный вариант для ROSTER — у ростера мест
// нет); GROUP_PLACES — окно мест X-Y внутри каждой группы источника;
// OVERALL_PLACES — окно мест X-Y сводного порядка источника (FR-5).
enum StageSelectorKind {
  STAGE_SELECTOR_KIND_UNSPECIFIED = 0;
  STAGE_SELECTOR_KIND_ALL = 1;
  STAGE_SELECTOR_KIND_GROUP_PLACES = 2;
  STAGE_SELECTOR_KIND_OVERALL_PLACES = 3;
}

// StageLayoutMethod — как отобранные ложатся в целевой этап (спека 0019,
// FR-4). Выводится сервером из типа целевого этапа при SetStageRule —
// клиент его не выбирает: SNAKE — существующее автораспределение змейкой
// (0009, FR-6) в групповой этап; SEEDED — классический посев 1×N в слоты
// сетки.
enum StageLayoutMethod {
  STAGE_LAYOUT_METHOD_UNSPECIFIED = 0;
  STAGE_LAYOUT_METHOD_SNAKE = 1;
  STAGE_LAYOUT_METHOD_SEEDED = 2;
}

// BracketConfig — параметры этапа-сетки (спека 0018, FR-1; ADR 0014 §1a).
// size — число слотов первого круга (степень двойки, 4..32); third_place —
// нужен ли бой за 3-е место. Задаётся при создании этапа (CreateStage) и
// не редактируется (FR-4) — изменить параметры можно только пересозданием.
message BracketConfig {
  int32 size = 1;
  bool third_place = 2;
}

// GroupsConfig — параметры этапа-групп (спека 0019, FR-8; ADR 0014 §1a).
// group_count — число групп; часть схемы этапа, живёт с ним (в отличие от
// значения на момент разового формирования) и не редактируется — этап
// пересоздают, как и bracket_size у сетки (0018, FR-4). 0 — у авто-этапа
// (0017, FR-4), который набирается только руками (FR-9) и правила иметь
// не может (FR-9a).
message GroupsConfig {
  int32 group_count = 1;
}

// SeedingRule — правило отбора этапа: источник, селектор, метод раскладки
// (спека 0019, FR-1). Presence в Stage.rule (не значения полей) отличает
// «правила нет» от заданного правила — у этапа без правила поле Stage.rule
// не заполняется вовсе. place_to = 0 — открытая верхняя граница («3 и
// ниже», FR-3); для selector = ALL place_from/place_to игнорируются.
// method сервер выводит сам из типа целевого этапа (FR-4) — клиент его не
// присылает при создании/SetStageRule, но он приходит в ответах как
// вычисленное значение.
message SeedingRule {
  StageSourceKind source_kind = 1;
  string source_stage_id = 2;
  StageSelectorKind selector = 3;
  int32 place_from = 4;
  int32 place_to = 5;
  StageLayoutMethod method = 6;
}

// SchemaIssueSeverity — класс проблемы диагностики схемы (спека 0020, FR-8).
// ERROR — формирование заведомо не пройдёт (то же, что отклонят гейты 0019).
// WARNING — формирование пройдёт, но результат может удивить. INFO — так и
// задумано, но организатор должен это видеть до формирования (ADR 0014,
// §5) — непокрытый хвост состава источника не дефект, а нормальный исход
// отбора, и предупреждением он обесценил бы предупреждения.
enum SchemaIssueSeverity {
  SCHEMA_ISSUE_SEVERITY_UNSPECIFIED = 0;
  SCHEMA_ISSUE_SEVERITY_ERROR = 1;
  SCHEMA_ISSUE_SEVERITY_WARNING = 2;
  SCHEMA_ISSUE_SEVERITY_INFO = 3;
}

// SchemaIssueCode — код проблемы диагностики схемы (спека 0020, FR-8/FR-9).
// Кода «групповой этап с одной группой» намеренно нет (FR-8a) — это законный
// формат «финал трёх», а не вырожденная раскладка.
enum SchemaIssueCode {
  SCHEMA_ISSUE_CODE_UNSPECIFIED = 0;
  // ошибки — заведомый отказ гейтов 0019
  SCHEMA_ISSUE_CODE_NO_GROUP_COUNT = 1;    // правило без числа групп (FR-7/FR-9a)
  SCHEMA_ISSUE_CODE_BAD_SOURCE = 2;        // источник не groups либо позже по схеме
  SCHEMA_ISSUE_CODE_SOURCE_CYCLE = 3;      // цикл источников (FR-4)
  SCHEMA_ISSUE_CODE_SELECTOR_OVERLAP = 4;  // окна веток пересекаются (0019 FR-11)
  SCHEMA_ISSUE_CODE_CAPACITY_EXCEEDED = 5; // отбор заведомо больше вместимости сетки (0019 FR-19)
  // предупреждения
  SCHEMA_ISSUE_CODE_CAPACITY_UNDERFILL = 6; // отбор заведомо меньше размера сетки — байи
  SCHEMA_ISSUE_CODE_COVERAGE_GAP = 7;       // разрыв между окнами веток
  SCHEMA_ISSUE_CODE_OVERLAP_UNKNOWN = 8;    // окна разных видов — проверится при формировании
  // информация
  SCHEMA_ISSUE_CODE_TAIL_UNCOVERED = 9;     // хвост состава источника никуда не идёт
}

// SchemaIssue — одна проблема схемы (спека 0020, FR-8). Текст формирует
// сервер (то же правило, что для BracketSlot.source_label 0018 и
// StageBuildEntry.origin_label 0019) — клиент строку из кода не собирает.
// stage_ids — этапы, к которым проблема привязана: один (напр. нет числа
// групп) либо два (пересечение веток).
message SchemaIssue {
  SchemaIssueSeverity severity = 1;
  SchemaIssueCode code = 2;
  repeated string stage_ids = 3;
  string message = 4;
}

// FormatStageSpec — один этап схемы вне привязки к номинации (спека 0020,
// FR-11). source_index — индекс этапа-источника В ЭТОМ ЖЕ repeated
// (>= 0), если source_kind = STAGE; иначе -1. Индекс, а не id, делает
// спецификацию переносимой между номинациями и переживающей турнир (FR-16).
message FormatStageSpec {
  string title = 1;
  StageType type = 2;
  BracketConfig bracket = 3;
  GroupsConfig groups = 4;
  StageSourceKind source_kind = 5;
  int32 source_index = 6;
  StageSelectorKind selector = 7;
  int32 place_from = 8;
  int32 place_to = 9;
  StageLayoutMethod method = 10;
}

// FormatPreset — именованная схема в глобальной библиотеке (спека 0020,
// FR-11/FR-12): живёт вне турнира и вне номинации, переживает оба.
message FormatPreset {
  string id = 1;
  string name = 2;
  repeated FormatStageSpec stages = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// FighterRef — проекция бойца для экрана управления пулами (DnD): id для
// перетаскивания, имя/клуб — снапшот из модуля fighter.
message FighterRef {
  string fighter_id = 1;
  string name = 2;
  string club = 3;
}

// Stage — этап номинации (спека 0017, FR-1; расширен спекой 0018).
// position — порядковый номер; несколько этапов могут делить одну позицию
// (параллельные ветки схемы, ADR 0014 §1), поэтому уникальности по
// (nomination_id, position) нет. status — статус фиксации состава этого
// этапа (спека 0018, FR-18/FR-19a): раньше жил только в PoolLayout.status,
// пока этап был один — со списком этапов нужен в каждой строке списка.
// bracket заполнен только у type = BRACKET (спека 0018, FR-1).
message Stage {
  string id = 1;
  string nomination_id = 2;
  int32 position = 3;
  string title = 4;
  StageType type = 5;
  PoolLayoutStatus status = 6;
  BracketConfig bracket = 7;
  // groups заполнен только у type = GROUPS, созданного явным CreateStage
  // (спека 0019, FR-7/FR-8); у авто-этапа (0017, FR-4) — не заполнен
  // (group_count = 0, FR-9).
  GroupsConfig groups = 8;
  // rule — правило отбора (спека 0019, FR-1); не заполнено, если у этапа
  // правила нет (набирается руками, как раньше).
  SeedingRule rule = 9;
  // execution_status — вычисляемый статус этапа целиком (спека 0021, FR-1).
  StageStatus execution_status = 10;
}

// PoolStanding — одна строка итоговой таблицы пула (спека 0016, FR-1..FR-4):
// статистика бойца по завершённым боям пула + итоговое место. place
// вычисляется сервером с учётом дележа (FR-3: полностью равные по
// wins/points_scored/points_conceded бойцы делят место — конкурентное
// ранжирование 1,2,2,4, не 1,2,2,3); клиент не пересчитывает и не
// досортировывает (FR-8).
message PoolStanding {
  FighterRef fighter = 1;
  int32 wins = 2;
  int32 draws = 3;
  int32 losses = 4;
  int32 points_scored = 5;
  int32 points_conceded = 6;
  int32 place = 7;
}

// Pool — пул (группа) номинации с его бойцами. Имя не редактируется
// (генерируется системой из номера, спека 0009 «Вне скоупа»).
// status/arena_id/arena_name — спека 0011: статус отдельного пула и, если он
// поставлен на арену, идентификатор и (резолвленное на момент чтения) имя
// площадки. arena_id/arena_name пусты, если пул не на арене.
// nomination_name — резолвленное на момент чтения название номинации пула
// (denormalized на чтении, по аналогии с arena_name): для экрана арены, где
// список «готовых пулов для постановки» собран из разных номинаций.
// standings — итоговая таблица пула (спека 0016). Пусто, если в пуле нет ни
// одного завершённого боя (FR-7) — так UI отличает «нечего показывать» от
// «все места нулевые». Осознанно не заполняется на путях, связанных с
// ареной/табло (GetPoolsForArena/GetBoutBoard — спека 0015 уже оставляет
// итоговые таблицы вне табло).
// stage_id (спека 0018, FR-18) — этап-владелец контейнера: у группового
// этапа контейнер — пул, у этапа-сетки — половина круга (FR-12/FR-12a).
// name у контейнера сетки — «1/4 финала, верхняя половина» вместо «Пул N»
// (FR-19a).
message Pool {
  string id = 1;
  string nomination_id = 2;
  int32 number = 3;
  string name = 4;
  repeated FighterRef members = 5;
  PoolStatus status = 6;
  string arena_id = 7;
  string arena_name = 8;
  string nomination_name = 9;
  repeated PoolStanding standings = 10;
  string stage_id = 11;
}

// BoardBout — проекция одного боя пула для доски ведения (спека 0013,
// FR-14): собственная проекция pool, не переиспользует bout.Bout (ADR 0002).
// score_a/score_b — актуальный счёт (0:0 у не начатого); state — текущая
// фаза ЖЦ боя.
message BoardBout {
  string id = 1;
  int32 round_number = 2;
  int32 sequence_number = 3;
  FighterRef fighter_a = 4;
  FighterRef fighter_b = 5;
  BoutState state = 6;
  int32 score_a = 7;
  int32 score_b = 8;
}

// BoutBoard — доска ведения боёв одной арены (спека 0013, FR-14): стоящий
// на ней пул, его бои по порядку проведения (0010) и текущий бой.
// current_bout_id пуст, если у пула нет боёв (0010, FR-4).
message BoutBoard {
  Pool pool = 1;
  repeated BoardBout bouts = 2;
  string current_bout_id = 3;
}

// ---------------------------------------------------------------------
// Спека 0018: плейофф-сетка с ручным посевом.
// ---------------------------------------------------------------------

// BracketSlotState — состояние слота сетки: занят бойцом, пуст (бай при
// недоборе, FR-9) либо ждёт победителя ещё не сыгранной пары (FR-13).
enum BracketSlotState {
  BRACKET_SLOT_STATE_UNSPECIFIED = 0;
  BRACKET_SLOT_STATE_FILLED = 1;
  BRACKET_SLOT_STATE_EMPTY = 2;
  BRACKET_SLOT_STATE_PENDING = 3;
}

// BracketSlot — один слот круга. slot — сквозной номер слота внутри круга
// (1-based); тем же именем адресуется в SeedBracketSlot/ClearBracketSlot
// (не position — у Stage.position уже другой смысл). source_label
// заполнен только у PENDING: «Победитель пары 3, 1/4 финала» (FR-13) —
// сервер формирует его сам, клиент не собирает строку из чисел.
message BracketSlot {
  int32 slot = 1;
  BracketSlotState state = 2;
  FighterRef fighter = 3;
  string source_label = 4;
}

// BracketPair — пара круга: слоты 2i-1 и 2i (FR-6). bout заполнен, только
// когда пара материализована (обе стороны известны, FR-13). resolved —
// пара разрешена: бой завершён, либо разрешение не требовало боя (бай,
// пустая пара) — из этого складывается «половина завершена» (FR-17).
message BracketPair {
  int32 index = 1;
  BracketSlot slot_a = 2;
  BracketSlot slot_b = 3;
  BoardBout bout = 4;
  bool resolved = 5;
}

// BracketHalf — половина круга: контейнер боёв (FR-12/FR-12a). half: 1 —
// верхняя, 2 — нижняя; у неделимого круга (финал, бой за 3-е место) ровно
// один элемент с half = 1 и пустым title. container — тот же Pool, что и у
// группы (members/standings пусты); с ним работают все RPC арены и табло,
// а container.name — подпись контейнера («1/4 финала, верхняя половина»,
// FR-19a), которую видит секретарь на экране площадки.
message BracketHalf {
  int32 half = 1;
  string title = 2;
  Pool container = 3;
  repeated BracketPair pairs = 4;
  string current_bout_id = 5;
}

// BracketRound — круг сетки. number: 1 — первый круг, R — финал,
// R+1 — бой за 3-е место. halves — одна или две половины (FR-6a).
message BracketRound {
  int32 number = 1;
  string title = 2;
  bool third_place = 3;
  repeated BracketHalf halves = 4;
}

// Bracket — сетка целиком: этап + круги. unassigned заполняется только на
// админском пути (кого ещё можно посеять, FR-7); в публичном снапшоте
// пуст. champion/third_place_winner — отображение, выведенное из
// завершённых боёв (FR-20), не доменный факт: протокол и призёры — план
// 0021.
message Bracket {
  Stage stage = 1;
  repeated BracketRound rounds = 2;
  repeated FighterRef unassigned = 3;
  bool can_undo = 4;
  FighterRef champion = 5;
  FighterRef third_place_winner = 6;
}

// ScoreboardRole — роль подписчика живого канала табло арены (спека 0015):
// табло (полноэкранный зрительский экран) или панель управления ареной.
// Первое подключённое табло (ordinal 1) становится источником таймера.
enum ScoreboardRole {
  SCOREBOARD_ROLE_UNSPECIFIED = 0;
  SCOREBOARD_ROLE_SCOREBOARD = 1;
  SCOREBOARD_ROLE_PANEL = 2;
}

// TimerStatus — состояние недоменного таймера табло (спека 0015, FR-9).
// Таймер не пишется в журнал боя и не влияет на ЖЦ боя/пула (FR-16):
// источник истины — авторитетное табло (клиент), сервер лишь ретранслирует.
enum TimerStatus {
  TIMER_STATUS_UNSPECIFIED = 0;
  TIMER_STATUS_STOPPED = 1;
  TIMER_STATUS_RUNNING = 2;
  TIMER_STATUS_PAUSED = 3;
  TIMER_STATUS_EXPIRED = 4;
}

// TimerCommandKind — команды панели управления таймером (спека 0015, FR-7).
enum TimerCommandKind {
  TIMER_COMMAND_KIND_UNSPECIFIED = 0;
  TIMER_COMMAND_KIND_START = 1;
  TIMER_COMMAND_KIND_PAUSE = 2;
  TIMER_COMMAND_KIND_RESET = 3;
  TIMER_COMMAND_KIND_ADJUST = 4;
}

// TimerCommand — команда таймера, ретранслируемая сервером от панели
// авторитетному табло (спека 0015, FR-7). amount_seconds — знаковое
// смещение, используется только для ADJUST (±1/±2/±3/±5).
message TimerCommand {
  TimerCommandKind kind = 1;
  int32 amount_seconds = 2;
}

// TimerFrame — полное состояние таймера в момент sampled_unix_ms по часам
// авторитетного табло (спека 0015, «синхроним полное время»). remaining_cs —
// сантисекунды (сотые доли секунды); default_cs — текущий дефолт комнаты
// (сантисекунды). Followers доводят локально между кадрами (клиентское
// сглаживание), сервер математику таймера не считает.
message TimerFrame {
  TimerStatus status = 1;
  int32 remaining_cs = 2;
  int64 sampled_unix_ms = 3;
  int32 default_cs = 4;
}

// ScoreboardRoom — состав живой комнаты арены с точки зрения текущего
// подписчика (спека 0015, FR-11/FR-12): сколько табло подключено, какой у
// этого подписчика порядковый номер (панель — 0) и является ли он
// источником таймера (табло ordinal 1). sides_swapped — эфемерный swap
// синий/красный (FR-6).
// reveal_generation — эфемерный монотонный счётчик «покажи текущий бой»
// (спека 0015, RevealCurrentBout): растёт на каждый явный клик секретаря;
// табло, увидев рост, снимает удержание прошлого боя независимо от его
// состояния. Как и sides_swapped — общий для комнаты, не зависит от роли
// подписчика.
message ScoreboardRoom {
  int32 scoreboard_count = 1;
  int32 this_ordinal = 2;
  bool this_is_source = 3;
  bool sides_swapped = 4;
  int32 reveal_generation = 5;
}

// ArenaLiveSnapshot — живой снапшот табло арены целиком (спека 0015): доска
// ведения (пусто, если на арене никто не стоит — FR-5), последнее известное
// состояние таймера, состав комнаты для этого подписчика, персистентный
// дефолт арены (для инициализации/сброса у авторитетного табло) и серверное
// время в момент отправки кадра (опора клиентской синхронизации часов).
message ArenaLiveSnapshot {
  BoutBoard board = 1;
  TimerFrame timer = 2;
  ScoreboardRoom room = 3;
  int32 default_duration_seconds = 4;
  int64 server_now_unix_ms = 5;
}

// PoolLayout — раскладка номинации целиком: статус, нераспределённые,
// пулы. can_undo — доступна ли кнопка «Отменить» (FR-7a). stage — этап,
// которому принадлежит раскладка (спека 0017, FR-11).
message PoolLayout {
  string nomination_id = 1;
  PoolLayoutStatus status = 2;
  repeated FighterRef unassigned = 3;
  repeated Pool pools = 4;
  bool can_undo = 5;
  Stage stage = 6;
}

// GetLayoutRequest — адресуется этапом (спека 0018, FR-18): раскладка
// принадлежит этапу, а не номинации целиком (0017 держала адресацию
// номинационной, пока этап был один).
message GetLayoutRequest {
  string stage_id = 1;
}

message GetLayoutResponse {
  PoolLayout layout = 1;
}

message CreatePoolRequest {
  string stage_id = 1;
}

message CreatePoolResponse {
  PoolLayout layout = 1;
}

message DeletePoolRequest {
  string pool_id = 1;
}

message DeletePoolResponse {
  PoolLayout layout = 1;
}

message ResetLayoutRequest {
  string stage_id = 1;
}

message ResetLayoutResponse {
  PoolLayout layout = 1;
}

// AssignFighterRequest — pool_id обязателен (целевой пул); если боец уже
// состоит в другом пуле этого этапа — это move одним действием (FR-5).
message AssignFighterRequest {
  string stage_id = 1;
  string fighter_id = 2;
  string pool_id = 3;
}

message AssignFighterResponse {
  PoolLayout layout = 1;
}

message UnassignFighterRequest {
  string stage_id = 1;
  string fighter_id = 2;
}

message UnassignFighterResponse {
  PoolLayout layout = 1;
}

message AutoDistributeRequest {
  string stage_id = 1;
}

message AutoDistributeResponse {
  PoolLayout layout = 1;
}

message UndoRequest {
  string stage_id = 1;
}

message UndoResponse {
  PoolLayout layout = 1;
}

message SetLayoutStatusRequest {
  string stage_id = 1;
  PoolLayoutStatus status = 2;
}

message SetLayoutStatusResponse {
  PoolLayout layout = 1;
}

// --- спека 0018: этапы, посев сетки ---

message ListStagesRequest {
  string nomination_id = 1;
}

// ListStagesResponse — issues (спека 0020, FR-8): диагностика схемы, чистая
// функция от того же набора этапов — отдельного RPC не заводим. Не уходит в
// StagePublicService (FR-19).
message ListStagesResponse {
  repeated Stage stages = 1;
  repeated SchemaIssue issues = 2;
}

message ListStagesForTournamentRequest {
  string tournament_id = 1;
}

// NominationStagesEntry — та же форма, что ListStagesResponse, для одной
// номинации в составе агрегирующего ответа (спека 0041).
message NominationStagesEntry {
  string nomination_id = 1;
  repeated Stage stages = 2;
  repeated SchemaIssue issues = 3;
}

message ListStagesForTournamentResponse {
  // entries — одна запись на каждую номинацию турнира (спека 0041, FR-8).
  repeated NominationStagesEntry entries = 1;
}

// CreateStageRequest — type = BRACKET (0018, FR-2) либо GROUPS (спека 0019,
// FR-7: явное создание, в отличие от авто-этапа 0017 FR-4). bracket
// заполняется только у BRACKET, groups — только у GROUPS. rule — опциональное
// правило отбора, задаётся тем же вызовом (спека 0019, FR-6); можно не
// передавать и задать позже SetStageRule, пока состав пуст.
message CreateStageRequest {
  string nomination_id = 1;
  StageType type = 2;
  string title = 3;
  BracketConfig bracket = 4;
  GroupsConfig groups = 5;
  SeedingRule rule = 6;
}

message CreateStageResponse {
  Stage created = 1;
  repeated Stage stages = 2;
}

message DeleteStageRequest {
  string stage_id = 1;
}

message DeleteStageResponse {
  repeated Stage stages = 1;
}

message GetBracketRequest {
  string stage_id = 1;
}

message GetBracketResponse {
  Bracket bracket = 1;
}

message SeedBracketSlotRequest {
  string stage_id = 1;
  int32 slot = 2;
  string fighter_id = 3;
}

message SeedBracketSlotResponse {
  Bracket bracket = 1;
}

message ClearBracketSlotRequest {
  string stage_id = 1;
  int32 slot = 2;
}

message ClearBracketSlotResponse {
  Bracket bracket = 1;
}

// --- спека 0019: переходы между этапами (правило отбора, превью, формирование) ---

message SetStageRuleRequest {
  string stage_id = 1;
  // rule — новое правило; не заполнено (все поля нулевые) — снять правило,
  // вернуть этап к ручному набору.
  SeedingRule rule = 2;
}

message SetStageRuleResponse {
  Stage stage = 1;
}

// StageBuildEntry — одна строка превью формирования (спека 0019, FR-15/
// FR-27): отобранный боец, откуда он пришёл и куда попадает. origin_label
// формирует сервер («Группа 2, место 1») — клиент строку из чисел не
// собирает (то же правило, что у BracketSlot.source_label, 0018 FR-13).
// target_pool_number заполнен для целевого группового этапа, target_slot —
// для целевой сетки; используется ровно одно из двух полей.
message StageBuildEntry {
  FighterRef fighter = 1;
  string origin_label = 2;
  int32 source_place = 3;
  int32 overall_place = 4;
  int32 target_pool_number = 5;
  int32 target_slot = 6;
}

// StageBuildTie — неразрешённый дележ на границе отбора (спека 0019, FR-22).
// source_pool_id пуст, если дележ обнаружен в сводном порядке (селектор
// OVERALL_PLACES) — там границы места не привязаны к одной группе.
message StageBuildTie {
  string source_pool_id = 1;
  string group_label = 2;
  int32 place = 3;
  repeated FighterRef contenders = 4;
  int32 slots_left = 5;
}

// TieResolution — ответ организатора на один дележ (спека 0019, FR-22):
// fighter_ids в порядке прохода, первые slots_left проходят. Передаётся в
// запросе, не персистируется (FR-24) — новое формирование спрашивает
// заново.
message TieResolution {
  string source_pool_id = 1;
  int32 place = 2;
  repeated string fighter_ids = 3;
}

// StageBuildPreview — план формирования целиком (спека 0019, FR-15).
// overlaps непуст ⇒ BuildStage будет отклонён (FR-11); ties непуст ⇒
// требуется TieResolution на каждый (FR-22); source_unfinished_bouts > 0 ⇒
// предупреждение о недоигранном источнике, формирование при этом разрешено
// (FR-14).
message StageBuildPreview {
  repeated StageBuildEntry entries = 1;
  repeated FighterRef unselected = 2;
  int32 capacity = 3;
  repeated StageBuildTie ties = 4;
  repeated FighterRef overlaps = 5;
  int32 source_unfinished_bouts = 6;
}

message PreviewStageBuildRequest {
  string stage_id = 1;
  repeated TieResolution ties = 2;
}

message PreviewStageBuildResponse {
  StageBuildPreview preview = 1;
}

message BuildStageRequest {
  string stage_id = 1;
  repeated TieResolution ties = 2;
}

// BuildStageResponse — результат формирования (спека 0019, FR-16): целевой
// групповой этап отдаёт свою раскладку (как GetLayout), целевая сетка — свой
// вид (как GetBracket) — клиент получает готовый к отображению результат без
// второго запроса.
message BuildStageResponse {
  oneof result {
    PoolLayout layout = 1;
    Bracket bracket = 2;
  }
}

message SeatPoolOnArenaRequest {
  string pool_id = 1;
  string arena_id = 2;
}

message SeatPoolOnArenaResponse {
  PoolLayout layout = 1;
}

message UnseatPoolRequest {
  string pool_id = 1;
}

message UnseatPoolResponse {
  PoolLayout layout = 1;
}

message GetPoolsForArenaRequest {
  string arena_id = 1;
}

// GetPoolsForArenaResponse — seated пуст, если на арене сейчас никто не
// стоит (спека 0011, FR-9).
message GetPoolsForArenaResponse {
  Pool seated = 1;
  repeated Pool available = 2;
}

message ListPublicPoolsRequest {
  string nomination_id = 1;
}

// ListPublicPoolsResponse — pools содержит только контейнеры групповых
// этапов (спека 0018): сетка публикуется отдельно через
// NominationLiveSnapshot.brackets, а не как список безымянных пулов.
message ListPublicPoolsResponse {
  repeated Pool pools = 1;
  // stages — этапы номинации (спека 0017), все, включая bracket (0018).
  repeated Stage stages = 2;
}

// LivePool — один пул живого снапшота номинации (спека 0014, FR-1..FR-3):
// сам пул (состав/статус/площадка, как в Pool) + его бои по порядку
// проведения с состоянием/счётом (BoardBout) + эффективный текущий бой.
// Отдельная проекция от BoutBoard (та — для одной арены; здесь — все пулы
// номинации разом, спека 0014 FR-11).
message LivePool {
  Pool pool = 1;
  repeated BoardBout bouts = 2;
  string current_bout_id = 3;
}

// NominationResultEntry — строка итогового протокола (спека 0021, FR-13).
// Место — диапазон «от–до» (FR-11): 1, 2, 3-4, 5-8. Одиночное место —
// place_from == place_to; клиент форматирует «5–8» сам и ничего не
// пересчитывает. Дальше — боец с именем/клубом (0007) и происхождение места
// человеческими словами: «выбыл в 1/4 финала», «Группа 2, место 1».
message NominationResultEntry {
  int32 place_from = 1;
  int32 place_to = 2;
  FighterRef fighter = 3;
  string origin_label = 4;
}

// NominationResultsSection — пьедестал одного терминального этапа (спека
// 0021, FR-9/FR-10). finished = false ⇒ entries пуст: пока этап не доигран,
// мест нет (FR-15), а сама секция нужна админке, чтобы показать «этап не
// доигран» (FR-19). places_from_overall_order = true у группового этапа
// больше чем на одну группу — интерфейс обязан показать оговорку про
// сведение без нормировки (FR-12, 0019 NFR-2).
message NominationResultsSection {
  string stage_id = 1;
  string stage_title = 2;
  StageType stage_type = 3;
  bool finished = 4;
  repeated NominationResultEntry entries = 5;
  bool places_from_overall_order = 6;
}

// NominationResults — итоговый протокол номинации (спека 0021): секция на
// каждый терминальный этап, у каждой свой пьедестал (FR-10). Сквозной
// нумерации мест по номинации нет.
message NominationResults {
  string nomination_id = 1;
  bool nomination_finished = 2;
  repeated NominationResultsSection sections = 3;
}

// NominationLiveSnapshot — живой снапшот номинации целиком (спека 0014):
// общий payload unary- и streaming-ответа. pools пуст, пока раскладка draft
// (FR-12). stages — этапы номинации (спека 0017); заполнен независимо от
// готовности раскладки.
// NominationLiveSnapshot — pools содержит только контейнеры групповых
// этапов, как ListPublicPoolsResponse; brackets — сетки номинации (спека
// 0018, FR-19), заполнены только для зафиксированных bracket-этапов, как
// pools заполнен только для готовой раскладки (0014, FR-12). unassigned
// внутри Bracket здесь не заполняется — публичный снапшот не показывает
// админский посев. results — итоговый протокол (спека 0021, FR-18): едет
// тем же живым каналом, чтобы призёры появлялись без перезагрузки.
message NominationLiveSnapshot {
  string nomination_id = 1;
  repeated LivePool pools = 2;
  repeated Stage stages = 3;
  repeated Bracket brackets = 4;
  NominationResults results = 5;
}

message GetNominationLiveRequest {
  string nomination_id = 1;
}

message GetNominationLiveResponse {
  NominationLiveSnapshot snapshot = 1;
}

message WatchNominationLiveRequest {
  string nomination_id = 1;
}

message WatchNominationLiveResponse {
  NominationLiveSnapshot snapshot = 1;
}

message GetNominationResultsRequest {
  string nomination_id = 1;
}

message GetNominationResultsResponse {
  NominationResults results = 1;
}

// ---------------------------------------------------------------------
// Спека 0034: публичная живая сводка турнира для главной страницы.
// ---------------------------------------------------------------------

// LiveArenaState — состояние площадки в публичной сводке турнира (спека
// 0034, FR-14). Проекция площадки для публики: своя ось, отдельная от
// PoolStatus/BoutState — гость видит только «идёт бой / готовится / нет
// пула», не внутренние статусы раскладки.
enum LiveArenaState {
  LIVE_ARENA_STATE_UNSPECIFIED = 0;
  LIVE_ARENA_STATE_FREE = 1;
  LIVE_ARENA_STATE_PREPARING = 2;
  LIVE_ARENA_STATE_BOUT_IN_PROGRESS = 3;
}

// LiveNominationPhase — фаза номинации для сайдбара публичной сводки
// (спека 0034, FR-20). Собственный enum, не NominationStatus: та ось про
// приём заявок (open/closed), эта — про исполнение (выведена из
// Stage.execution_status этапов, спека 0021), и они независимы.
enum LiveNominationPhase {
  LIVE_NOMINATION_PHASE_UNSPECIFIED = 0;
  LIVE_NOMINATION_PHASE_UPCOMING = 1;
  LIVE_NOMINATION_PHASE_RUNNING = 2;
  LIVE_NOMINATION_PHASE_FINISHED = 3;
}

// LiveFeedBout — одна строка ленты боёв дня (спека 0034, FR-15/FR-16):
// бой любой номинации турнира с площадкой и фактическим временем.
// started_at/finished_at не заполнены, если соответствующее событие ещё не
// произошло (FR-16, AC-13) — клиент показывает прочерк, не 0/эпоху.
message LiveFeedBout {
  string bout_id = 1;
  string nomination_id = 2;
  string nomination_name = 3;
  string stage_title = 4;
  string pool_name = 5;
  string arena_id = 6;
  string arena_name = 7;
  int32 sequence_number = 8;
  int32 pool_bout_total = 9;
  FighterRef fighter_a = 10;
  FighterRef fighter_b = 11;
  BoutState state = 12;
  int32 score_a = 13;
  int32 score_b = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp finished_at = 16;
}

// LiveArena — карточка площадки публичной сводки (спека 0034, FR-14).
// current_bout заполнен у PREPARING (первая непроведённая пара пула) и у
// BOUT_IN_PROGRESS (идущий бой); не заполнен у FREE.
message LiveArena {
  string arena_id = 1;
  string arena_name = 2;
  int32 position = 3;
  LiveArenaState state = 4;
  string nomination_id = 5;
  string nomination_name = 6;
  string pool_name = 7;
  string stage_title = 8;
  LiveFeedBout current_bout = 9;
  int32 pool_bout_total = 10;
  int32 pool_bout_finished = 11;
}

// LiveNomination — строка сайдбара «Номинации» публичной сводки (спека
// 0034, FR-20).
message LiveNomination {
  string nomination_id = 1;
  string title = 2;
  int32 position = 3;
  LiveNominationPhase phase = 4;
  string current_stage_title = 5;
  int32 bout_total = 6;
  int32 bout_finished = 7;
  int32 fighter_count = 8;
}

// TournamentLiveSnapshot — живая сводка турнира целиком (спека 0034):
// общий payload unary- и streaming-ответа. Порядок ленты (FR-17) и её
// фильтрация по номинации (FR-18) — представление, вычисляется на клиенте
// из bouts как есть (план, «Обзор решения»).
message TournamentLiveSnapshot {
  string tournament_id = 1;
  repeated LiveArena arenas = 2;
  repeated LiveFeedBout bouts = 3;
  repeated LiveNomination nominations = 4;
  int64 server_now_unix_ms = 5;
}

// GetTournamentLiveRequest — tournament_id обязателен и должен указывать на
// активный турнир (MVP), как ListNominationsRequest/ArenaAdminService.List:
// клиент резолвит id заранее через TournamentService.GetActiveTournament,
// сервер здесь его не подставляет по умолчанию.
message GetTournamentLiveRequest {
  string tournament_id = 1;
}

message GetTournamentLiveResponse {
  TournamentLiveSnapshot snapshot = 1;
}

message WatchTournamentLiveRequest {
  string tournament_id = 1;
}

message WatchTournamentLiveResponse {
  TournamentLiveSnapshot snapshot = 1;
}

message GetBoutBoardRequest {
  string arena_id = 1;
}

message GetBoutBoardResponse {
  BoutBoard board = 1;
}

message GetArenaBoardsRequest {
  string tournament_id = 1;
}

// ArenaBoardEntry — та же форма, что GetBoutBoardResponse, для одной
// площадки в составе агрегирующего ответа (спека 0041). board не заполнен,
// если на площадке никто не стоит (та же семантика, что у GetBoutBoard).
message ArenaBoardEntry {
  string arena_id = 1;
  BoutBoard board = 2;
}

message GetArenaBoardsResponse {
  // entries — одна запись на каждую неархивную площадку турнира (спека
  // 0041, FR-7).
  repeated ArenaBoardEntry entries = 1;
}

// BoutEventKind — вид записи журнала площадки (спека 0033, FR-33/FR-36).
// scheduled сознательно не входит в enum — формирование пар системное, без
// человека-автора, и в журнал площадки не попадает.
enum BoutEventKind {
  BOUT_EVENT_KIND_UNSPECIFIED = 0;
  BOUT_EVENT_KIND_STARTED = 1;
  BOUT_EVENT_KIND_SCORED = 2;
  BOUT_EVENT_KIND_FINISHED = 3;
  BOUT_EVENT_KIND_REOPENED = 4;
  BOUT_EVENT_KIND_RESET = 5;
}

// BoutJournalEntry — одна запись журнала боёв площадки (спека 0033,
// FR-33/FR-34). score_a/score_b значимы для SCORED и FINISHED (снапшот
// итога у finished — как в payload события, спека 0013). actor_display_name
// — обогащение на чтении (приём спеки 0025, UserProvider.DisplayNames);
// пусто, если у события нет автора либо пользователь удалён.
message BoutJournalEntry {
  string bout_id = 1;
  int32 sequence_number = 2;
  FighterRef fighter_a = 3;
  FighterRef fighter_b = 4;
  BoutEventKind kind = 5;
  int32 score_a = 6;
  int32 score_b = 7;
  google.protobuf.Timestamp occurred_at = 8;
  string actor_display_name = 9;
}

message GetArenaJournalRequest {
  string arena_id = 1;
  // limit — сколько последних записей вернуть; 0 = дефолт сервера (50).
  int32 limit = 2;
}

message GetArenaJournalResponse {
  // entries — новыми событиями вперёд (порядок задаёт сервер).
  repeated BoutJournalEntry entries = 1;
}

// SetCurrentBoutRequest/Response и далее — каждое действие ведения боя имеет
// собственную пару Request/Response (buf lint: сообщение не переиспользуется
// между разными RPC, см. аналогичную заметку в bout.proto), хотя ответы по
// форме идентичны: возвращают обновлённую доску арены, на которой стоит пул
// (спека 0013, FR-14) — клиенту не нужен отдельный round-trip за доской.

message SetCurrentBoutRequest {
  string pool_id = 1;
  string bout_id = 2;
}

message SetCurrentBoutResponse {
  BoutBoard board = 1;
}

message StartCurrentBoutRequest {
  string pool_id = 1;
}

message StartCurrentBoutResponse {
  BoutBoard board = 1;
}

message ScoreCurrentBoutRequest {
  string pool_id = 1;
  int32 score_a = 2;
  int32 score_b = 3;
}

message ScoreCurrentBoutResponse {
  BoutBoard board = 1;
}

message FinishCurrentBoutRequest {
  string pool_id = 1;
}

message FinishCurrentBoutResponse {
  BoutBoard board = 1;
}

message ReopenCurrentBoutRequest {
  string pool_id = 1;
}

message ReopenCurrentBoutResponse {
  BoutBoard board = 1;
}

message ResetCurrentBoutRequest {
  string pool_id = 1;
}

message ResetCurrentBoutResponse {
  BoutBoard board = 1;
}

message WatchArenaBoardRequest {
  string arena_id = 1;
  ScoreboardRole role = 2;
}

// WatchArenaBoardResponse — событие живого канала табло арены (спека 0015).
// snapshot — полное состояние (при подключении и на каждое изменение
// доски/таймера/комнаты/swap); command — ретранслированная команда панели,
// адресованная авторитетному табло (само значение таймера на сервере не
// меняется).
message WatchArenaBoardResponse {
  oneof event {
    ArenaLiveSnapshot snapshot = 1;
    TimerCommand command = 2;
  }
}

// PublishTimerFrameRequest — вызывается только авторитетным табло (ordinal 1
// комнаты арены). Отклоняется (FailedPrecondition), если вызывающий поток —
// не источник.
message PublishTimerFrameRequest {
  string arena_id = 1;
  TimerFrame frame = 2;
}

message PublishTimerFrameResponse {
  ArenaLiveSnapshot snapshot = 1;
}

message ControlArenaTimerRequest {
  string arena_id = 1;
  TimerCommand command = 2;
}

message ControlArenaTimerResponse {
  ArenaLiveSnapshot snapshot = 1;
}

message SetScoreboardSidesRequest {
  string arena_id = 1;
  bool swapped = 2;
}

message SetScoreboardSidesResponse {
  ArenaLiveSnapshot snapshot = 1;
}

message RevealCurrentBoutRequest {
  string arena_id = 1;
}

message RevealCurrentBoutResponse {
  ArenaLiveSnapshot snapshot = 1;
}

// --- спека 0020: конструктор схемы (редактирование этапа) + пресеты формата ---

// UpdateStageRequest — конфиг целиком, не маска изменённых полей (полей три,
// Stage и так возвращается целиком). Сервер сам сравнивает присланный конфиг
// с текущим: если он не изменился, гейт «состав пуст» не применяется —
// переименование доступно всегда (спека 0020, FR-2). bracket заполняется
// только у type = BRACKET, groups — только у type = GROUPS (как в
// CreateStageRequest); тип этапа не передаётся — сменить его нечем (AC-3).
message UpdateStageRequest {
  string stage_id = 1;
  string title = 2;
  BracketConfig bracket = 3;
  GroupsConfig groups = 4;
}

message UpdateStageResponse {
  Stage stage = 1;
}

message ListFormatPresetsRequest {}

message ListFormatPresetsResponse {
  repeated FormatPreset presets = 1;
}

// SaveFormatPresetRequest — пресет берёт номинацию, а не тело схемы: пресет
// — отпечаток уже существующей схемы (спека 0020, FR-11), собирать его на
// клиенте значило бы дублировать маппинг.
message SaveFormatPresetRequest {
  string name = 1;
  string nomination_id = 2;
}

message SaveFormatPresetResponse {
  FormatPreset preset = 1;
}

message RenameFormatPresetRequest {
  string preset_id = 1;
  string name = 2;
}

message RenameFormatPresetResponse {
  FormatPreset preset = 1;
}

message DeleteFormatPresetRequest {
  string preset_id = 1;
}

message DeleteFormatPresetResponse {}

// ApplyFormatRequest — источник спецификации: пресет библиотеки либо схема
// другой номинации того же турнира (спека 0020, FR-13/FR-15) — применение
// пресета и копирование схемы отличаются только тем, откуда собирается
// спецификация, поэтому один RPC с oneof, а не два.
message ApplyFormatRequest {
  string nomination_id = 1;
  oneof source {
    string preset_id = 2;
    string source_nomination_id = 3;
  }
}

message ApplyFormatResponse {
  repeated Stage stages = 1;
}

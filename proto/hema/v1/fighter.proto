syntax = "proto3";

package hema.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/hema/server/gen/hema/v1;hemav1";

// FighterAdminService — управление ростером бойцов турнира (секретарь).
// Все RPC требуют роль ADMIN (проверяется серверным интерсептором
// RequireAdmin). Боец — внутренняя сущность турнира, отвязанная от
// пользователей системы (спека 0007).
service FighterAdminService {
  // CreateFighter заводит бойца вручную (без электронной заявки) и назначает
  // его в одну или несколько номинаций. Без проверок лимитов/дублей.
  rpc CreateFighter(CreateFighterRequest) returns (CreateFighterResponse);
  // EditFighter правит имя и клуб бойца независимо от заявки/профиля.
  rpc EditFighter(EditFighterRequest) returns (EditFighterResponse);
  // WithdrawFighter выводит бойца со всего турнира с причиной (травма/бан/
  // иное). Боец не участвует в боях, но остаётся в системе.
  rpc WithdrawFighter(WithdrawFighterRequest) returns (WithdrawFighterResponse);
  // ReturnFighter возвращает ранее выведенного бойца в прежний состав участий.
  rpc ReturnFighter(ReturnFighterRequest) returns (ReturnFighterResponse);
  // AddToNomination добавляет бойцу участие в номинации (идемпотентно для
  // уже активного участия).
  rpc AddToNomination(AddToNominationRequest) returns (AddToNominationResponse);
  // RemoveFromNomination снимает бойца с одной номинации; в других
  // номинациях боец продолжает. Обратимо (AddToNomination).
  rpc RemoveFromNomination(RemoveFromNominationRequest) returns (RemoveFromNominationResponse);
  // MoveFighter переводит бойца из одной номинации в другую (снять с одной +
  // добавить в другую одной операцией).
  rpc MoveFighter(MoveFighterRequest) returns (MoveFighterResponse);
  // GetFighter возвращает одного бойца со всеми его участиями.
  rpc GetFighter(GetFighterRequest) returns (GetFighterResponse);
  // ListRoster возвращает ростер турнира: бойцов с их участиями и статусами.
  rpc ListRoster(ListRosterRequest) returns (ListRosterResponse);
  // FindFighterByAccount ищет бойца турнира по учётке пользователя (спека
  // 0040, FR-9). Пустой fighter в ответе — «у этой учётки нет бойца в этом
  // турнире», не ошибка (тот же приём, что GetMyFighter/FR-41 спеки 0038).
  rpc FindFighterByAccount(FindFighterByAccountRequest) returns (FindFighterByAccountResponse);
  // MergeFighters сводит дубль source в target: участия переносятся на
  // target (совпадающие по номинации — не дублируются), source помечается
  // объединённым (FIGHTER_STATUS_MERGED), не удаляется физически (спека
  // 0040, FR-10).
  rpc MergeFighters(MergeFightersRequest) returns (MergeFightersResponse);
  // ImportFighters разбирает файл со списком участников (CSV/XLSX) и заводит
  // бойцов (спека 0049). dry_run=true возвращает тот же отчёт, ничего не
  // записав, — предпросмотр (FR-2). Ошибки уровня файла (неизвестный формат,
  // нет колонки имени, превышен лимит) — connect.CodeInvalidArgument; ошибки
  // уровня строки не ошибка RPC, а исход строки в отчёте (FR-9).
  rpc ImportFighters(ImportFightersRequest) returns (ImportFightersResponse);
}

// FighterPublicService — публичное чтение состава номинации. RPC доступны
// без access-токена (перечислены в publicProcedures интерсептора Auth).
service FighterPublicService {
  // ListNominationRoster возвращает состав номинации: имя, клуб и статус
  // участия каждого бойца. Выведенные/снятые показываются как «выбыл», не
  // скрываются.
  rpc ListNominationRoster(ListNominationRosterRequest) returns (ListNominationRosterResponse);
}

// FighterService — чтение своего бойца пользователем (спека 0038, FR-38..
// FR-42; ADR 0016). Требует access-токен (НЕ входит в publicProcedures
// интерсептора Auth); пользователь берётся из токена, не из тела запроса —
// узнать чужого бойца по этому RPC нельзя.
service FighterService {
  // GetMyFighter возвращает бойца текущего пользователя в турнире (по
  // умолчанию — активном). Пустой fighter в ответе — не ошибка: у
  // подавляющего большинства учёток бойца нет (FR-41).
  rpc GetMyFighter(GetMyFighterRequest) returns (GetMyFighterResponse);
}

// FighterStatus — статус бойца на уровне всего турнира.
enum FighterStatus {
  FIGHTER_STATUS_UNSPECIFIED = 0;
  FIGHTER_STATUS_ACTIVE = 1;
  FIGHTER_STATUS_WITHDRAWN = 2;
  // FIGHTER_STATUS_MERGED — запись-источник после слияния дублей (спека
  // 0040, FR-10). Не удаляется физически, merged_into_id указывает на
  // итоговую запись.
  FIGHTER_STATUS_MERGED = 3;
}

// WithdrawalReason — причина вывода бойца с турнира.
enum WithdrawalReason {
  WITHDRAWAL_REASON_UNSPECIFIED = 0;
  WITHDRAWAL_REASON_INJURY = 1;
  WITHDRAWAL_REASON_BAN = 2;
  WITHDRAWAL_REASON_OTHER = 3;
}

// ParticipationStatus — статус участия бойца в конкретной номинации.
enum ParticipationStatus {
  PARTICIPATION_STATUS_UNSPECIFIED = 0;
  PARTICIPATION_STATUS_ACTIVE = 1;
  PARTICIPATION_STATUS_REMOVED = 2;
}

// Participation — участие бойца в одной номинации.
message Participation {
  string nomination_id = 1;
  ParticipationStatus status = 2;
}

// Fighter — персона-участник турнира, отвязанная от пользователей системы.
// Имя/клуб — снапшот (из заявки при регистрации либо введённые admin).
message Fighter {
  string id = 1;
  string tournament_id = 2;
  string name = 3;
  string club = 4;
  FighterStatus status = 5;
  WithdrawalReason withdrawal_reason = 6;
  repeated Participation participations = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // from_application — боец появился регистрацией заявки (true) либо
  // заведён admin вручную (false). Признак, а не идентификатор
  // заявителя: origin_user_id наружу не отдаётся (спека 0007 отвязала
  // бойца от учётки, спека 0026 NFR-2 связь не восстанавливает).
  bool from_application = 10;
  // linked_account_id (спека 0040, FR-8): непусто, если у бойца есть
  // привязанная учётка (origin_user_id). Заполняется ТОЛЬКО в ответах
  // FighterAdminService — FighterPublicService/FighterService (свой боец,
  // ADR 0016) это поле не сериализуют: граница ADR 0016 не расширяется,
  // проверяется на уровне api-хендлера, не сообщения.
  string linked_account_id = 11;
  string linked_account_display_name = 12;
  // merged_into_id (спека 0040, FR-10): непусто, если status =
  // FIGHTER_STATUS_MERGED — id записи, в которую слит этот боец.
  string merged_into_id = 13;
}

// RosterEntry — элемент публичного состава номинации. Без id/происхождения:
// публичная выдача не раскрывает внутренние идентификаторы.
message RosterEntry {
  string name = 1;
  string club = 2;
  // in_roster — true, если боец активен и участие в номинации активно
  // («в составе»); false — выведен/снят («выбыл»).
  bool in_roster = 3;
}

message CreateFighterRequest {
  string tournament_id = 1;
  string name = 2;
  string club = 3;
  repeated string nomination_ids = 4;
}

message CreateFighterResponse {
  Fighter fighter = 1;
}

message EditFighterRequest {
  string fighter_id = 1;
  string name = 2;
  string club = 3;
}

message EditFighterResponse {
  Fighter fighter = 1;
}

message WithdrawFighterRequest {
  string fighter_id = 1;
  WithdrawalReason reason = 2;
}

message WithdrawFighterResponse {
  Fighter fighter = 1;
}

message ReturnFighterRequest {
  string fighter_id = 1;
}

message ReturnFighterResponse {
  Fighter fighter = 1;
}

message AddToNominationRequest {
  string fighter_id = 1;
  string nomination_id = 2;
}

message AddToNominationResponse {
  Fighter fighter = 1;
}

message RemoveFromNominationRequest {
  string fighter_id = 1;
  string nomination_id = 2;
}

message RemoveFromNominationResponse {
  Fighter fighter = 1;
}

message MoveFighterRequest {
  string fighter_id = 1;
  string from_nomination_id = 2;
  string to_nomination_id = 3;
}

message MoveFighterResponse {
  Fighter fighter = 1;
}

message GetFighterRequest {
  string fighter_id = 1;
}

message GetFighterResponse {
  Fighter fighter = 1;
}

// ListRosterRequest — ростер турнира (спека 0041); tournament_id опционален
// (при пустом — используется активный турнир, MVP с единственным активным
// турниром). Остальные фильтры опциональны и комбинируются логическим И;
// пустое поле = без ограничения по нему. nomination_ids фильтрует по
// активному участию бойца. clubs без include_no_club не включает бойцов с
// незаполненным клубом — include_no_club добавляет их отдельно (клуб —
// свободный текст, «пусто» не значение, которое можно положить в clubs).
// search — подстрока по имени и клубу, без учёта регистра. limit/offset —
// постраничность в стиле ListUsersRequest (admin.proto).
message ListRosterRequest {
  optional string tournament_id = 1;
  repeated FighterStatus statuses = 2;
  repeated string nomination_ids = 3;
  repeated string clubs = 4;
  bool include_no_club = 5;
  optional string search = 6;
  int32 limit = 7;
  int32 offset = 8;
}

// FighterStatusCount — счётчик бойцов по статусу, посчитанный по всему
// ростеру турнира вне зависимости от фильтров/поиска запроса (спека 0041,
// FR-4).
message FighterStatusCount {
  FighterStatus status = 1;
  int32 count = 2;
}

message ListRosterResponse {
  // fighters — страница, отфильтрованная и упорядоченная согласно запросу,
  // не весь ростер турнира (спека 0041).
  repeated Fighter fighters = 1;
  // total_count — число бойцов, подходящих под фильтр (без limit/offset) —
  // для постраничной навигации (спека 0041, FR-5).
  int32 total_count = 2;
  repeated FighterStatusCount status_counts = 3;
}

// FindFighterByAccountRequest — tournament_id опционален: пустой — активный
// турнир (как ListRosterRequest).
message FindFighterByAccountRequest {
  string user_id = 1;
  optional string tournament_id = 2;
}

message FindFighterByAccountResponse {
  // fighter не заполнен, если у учётки нет бойца в этом турнире.
  Fighter fighter = 1;
}

message MergeFightersRequest {
  string source_fighter_id = 1;
  // target_fighter_id — «итоговая» запись: её origin_user_id и снапшот
  // имени/клуба остаются в силе после слияния.
  string target_fighter_id = 2;
}

message MergeFightersResponse {
  // fighter — итоговая запись (target) после слияния.
  Fighter fighter = 1;
}

message ListNominationRosterRequest {
  string nomination_id = 1;
}

message ListNominationRosterResponse {
  repeated RosterEntry entries = 1;
}

// GetMyFighterRequest — tournament_id опционален: пустой — активный турнир
// (как ListRosterRequest).
message GetMyFighterRequest {
  optional string tournament_id = 1;
}

message GetMyFighterResponse {
  // fighter не заполнен, если у пользователя нет бойца в турнире (FR-41).
  Fighter fighter = 1;
}

// ImportRowOutcome — исход одной строки импортируемого файла (спека 0049).
enum ImportRowOutcome {
  IMPORT_ROW_OUTCOME_UNSPECIFIED = 0;
  // IMPORT_ROW_OUTCOME_CREATED — заведён новый боец.
  IMPORT_ROW_OUTCOME_CREATED = 1;
  // IMPORT_ROW_OUTCOME_UPDATED — боец уже есть, добавлены недостающие
  // участия (FR-8).
  IMPORT_ROW_OUTCOME_UPDATED = 2;
  // IMPORT_ROW_OUTCOME_SKIPPED — полный дубль: ничего не меняется (AC-6).
  IMPORT_ROW_OUTCOME_SKIPPED = 3;
  // IMPORT_ROW_OUTCOME_REJECTED — строка не применена, причина в error.
  IMPORT_ROW_OUTCOME_REJECTED = 4;
}

// ImportRowError — причина отклонения строки (FR-5/FR-6/FR-8a).
enum ImportRowError {
  IMPORT_ROW_ERROR_UNSPECIFIED = 0;
  IMPORT_ROW_ERROR_EMPTY_NAME = 1;
  IMPORT_ROW_ERROR_UNKNOWN_NOMINATION = 2;
  IMPORT_ROW_ERROR_FIGHTER_WITHDRAWN = 3;
}

// ImportRowReport — строка отчёта: и предпросмотра (dry_run), и результата.
message ImportRowReport {
  // line — номер строки в файле, как её видит admin в редакторе, с учётом
  // строки заголовка (FR-11a).
  int32 line = 1;
  string name = 2;
  string club = 3;
  ImportRowOutcome outcome = 4;
  // nomination_titles — номинации строки как они записаны в файле; пусто,
  // если колонка пуста и сработало умолчание из UI (FR-5a).
  repeated string nomination_titles = 5;
  // added_nomination_ids — участия, которые появятся (CREATED/UPDATED).
  repeated string added_nomination_ids = 6;
  // fighter_id — существующий боец для UPDATED/SKIPPED и для отклонения по
  // IMPORT_ROW_ERROR_FIGHTER_WITHDRAWN; для CREATED при dry_run пуст (бойца
  // ещё нет), после импорта заполнен.
  string fighter_id = 7;
  ImportRowError error = 8;
  // error_detail — уточнение: нераспознанное название номинации.
  string error_detail = 9;
}

// ImportSummary — сводка по файлу (FR-4).
message ImportSummary {
  int32 rows_read = 1;
  int32 created = 2;
  int32 updated = 3;
  int32 skipped = 4;
  int32 rejected = 5;
}

message ImportFightersRequest {
  // tournament_id опционален: пустой — активный турнир (как ListRosterRequest).
  optional string tournament_id = 1;
  bytes content = 2;
  // file_name — по расширению (.csv/.xlsx) выбирается разборщик.
  string file_name = 3;
  // default_nomination_ids — применяются к строкам, где колонка номинаций
  // пуста (FR-5a). Непустая колонка в строке всегда важнее умолчания.
  repeated string default_nomination_ids = 4;
  // dry_run — предпросмотр без записи (FR-2).
  bool dry_run = 5;
}

message ImportFightersResponse {
  ImportSummary summary = 1;
  repeated ImportRowReport rows = 2;
  // dry_run — эхо запроса: UI не должен путать предпросмотр с отчётом.
  bool dry_run = 3;
}

syntax = "proto3";

package hema.v1;

import "google/protobuf/timestamp.proto";
import "hema/v1/common.proto";

option go_package = "github.com/hema/server/gen/hema/v1;hemav1";

// TournamentService — публичное чтение активного турнира. RPC доступны без
// access-токена (перечислены в publicProcedures интерсептора Auth).
service TournamentService {
  // GetActiveTournament возвращает активный турнир для главной страницы.
  rpc GetActiveTournament(GetActiveTournamentRequest) returns (GetActiveTournamentResponse);
}

// TournamentAdminService — управление профилем турнира. Все RPC требуют роль
// ADMIN (проверяется серверным интерсептором RequireAdmin).
service TournamentAdminService {
  // UpdateActiveTournament обновляет поля активного турнира целиком, включая
  // список контактов (полная замена набора контактов).
  rpc UpdateActiveTournament(UpdateActiveTournamentRequest) returns (UpdateActiveTournamentResponse);
  // UploadTournamentFile загружает файл регламента или эмблемы турнира
  // (спека 0042, FR-30/FR-31). Вид передаётся параметром kind — путь
  // валидации и хранения общий, политика (тип/порог) различается по виду.
  // Загруженный файл вытесняет соответствующую ссылку (FR-34).
  rpc UploadTournamentFile(UploadTournamentFileRequest) returns (UploadTournamentFileResponse);
  // DeleteTournamentFile удаляет загруженный файл регламента или эмблемы
  // (FR-36), освобождая объект в хранилище.
  rpc DeleteTournamentFile(DeleteTournamentFileRequest) returns (DeleteTournamentFileResponse);
}

// TournamentFileKind — вид файла профиля турнира (спека 0042).
enum TournamentFileKind {
  TOURNAMENT_FILE_KIND_UNSPECIFIED = 0;
  TOURNAMENT_FILE_KIND_REGULATIONS = 1;
  TOURNAMENT_FILE_KIND_EMBLEM = 2;
}

// ContactType — канал связи с организаторами турнира.
enum ContactType {
  CONTACT_TYPE_UNSPECIFIED = 0;
  CONTACT_TYPE_TELEGRAM = 1;
  CONTACT_TYPE_VK = 2;
  CONTACT_TYPE_FACEBOOK = 3;
  CONTACT_TYPE_WEBSITE = 4;
  CONTACT_TYPE_EMAIL = 5;
  CONTACT_TYPE_OTHER = 6;
}

// Tournament — профиль турнира.
message Tournament {
  string id = 1;
  string title = 2;
  string description = 3;
  // event_start_at — дата и время начала проведения с временной зоной.
  // Опционально (турнир без назначенной даты допустим). Для однодневного
  // турнира задается только start; для многодневного — start + end.
  google.protobuf.Timestamp event_start_at = 4;
  // emblem_url — URL на эмблему турнира (внешнее изображение). Опционально.
  string emblem_url = 5;
  bool is_active = 6;
  repeated Contact contacts = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // event_end_at — дата и время окончания (многодневные турниры). Опционально;
  // если задано, то event_start_at обязательно и end >= start.
  google.protobuf.Timestamp event_end_at = 10;
  // chief_judge — главный судья турнира (ФИО свободной строкой). Опционально.
  string chief_judge = 11;
  // regulations_url — веб-адрес регламента (обычно PDF). Только http/https.
  // Опционально.
  string regulations_url = 12;
  // venue_name / venue_address — место проведения: название площадки и
  // почтовый адрес. Опциональны независимо друг от друга.
  string venue_name = 13;
  string venue_address = 14;
  // entry_fee_minor — взнос за участие в ОДНОЙ номинации, в минорных
  // единицах валюты (копейки). Presence различает «не задан» (поле не
  // установлено) и «ноль» (бесплатное участие). Задан ⇒
  // entry_fee_currency непустой.
  optional int64 entry_fee_minor = 15;
  // entry_fee_currency — код валюты ISO-4217 (например "RUB").
  string entry_fee_currency = 16;
  // program — программа турнира по дням (спека 0040, FR-14/FR-15). Пустой
  // список — программа не задана, раздел не показывается (FR-16). Дни
  // задаются organizer вручную, без жёсткой привязки к event_start_at/
  // event_end_at (FR-14a).
  repeated TournamentProgramDay program = 17;
  // regulations_file — загруженный файл регламента (спека 0042, FR-30).
  // Пустой url — файла нет, регламент (если задан) — по regulations_url.
  // Источник ровно один: непустой url здесь означает, что
  // regulations_url игнорируется (FR-34).
  TournamentFile regulations_file = 18;
  // emblem_file — загруженный файл эмблемы (FR-31), та же семантика
  // относительно emblem_url.
  TournamentFile emblem_file = 19;
  // notifications — глобальные переключатели уведомлений турнира (FR-19).
  // Оба выключены по умолчанию; письмо уходит только когда и этот, и
  // личный переключатель получателя разрешают один вид (FR-21).
  NotificationSettings notifications = 20;
}

// TournamentFile — загруженный файл профиля турнира (регламент или
// эмблема, спека 0042). Одна форма на оба поля — набор атрибутов
// одинаковый.
message TournamentFile {
  // url — публичный адрес скачивания. Пустая строка — файл не загружен.
  string url = 1;
  // name — исходное имя файла на момент загрузки.
  string name = 2;
  // size — размер файла в байтах.
  int64 size = 3;
}

// TournamentProgramItem — один пункт программы дня (спека 0040, FR-14):
// время + короткий текст («9:00 — Сбор участников»). time_label — короткая
// метка, не строгий формат времени.
message TournamentProgramItem {
  string time_label = 1;
  string text = 2;
}

// TournamentProgramDay — один день программы турнира.
message TournamentProgramDay {
  // date — YYYY-MM-DD, без временной зоны.
  string date = 1;
  repeated TournamentProgramItem items = 2;
}

// Contact — один канал связи: тип + значение, с позицией в списке.
message Contact {
  string id = 1;
  ContactType type = 2;
  string value = 3;
  int32 position = 4;
}

message GetActiveTournamentRequest {}

message GetActiveTournamentResponse {
  Tournament tournament = 1;
}

// UpdateActiveTournamentRequest — новые значения полей активного турнира.
// Контакты передаются целиком (старый набор заменяется новым).
message UpdateActiveTournamentRequest {
  string title = 1;
  string description = 2;
  // event_start_at — null/нуль означает «дата начала не задана» (опционально).
  google.protobuf.Timestamp event_start_at = 3;
  string emblem_url = 4;
  repeated ContactInput contacts = 5;
  // event_end_at — null/нуль означает «однодневный/без даты окончания».
  // Если задано, event_start_at обязательно и end >= start.
  google.protobuf.Timestamp event_end_at = 6;
  // chief_judge — главный судья турнира. Пустая строка — «не указан».
  string chief_judge = 7;
  // regulations_url — веб-адрес регламента. Пустая строка — «не задан»;
  // непустая проверяется на схему http/https.
  string regulations_url = 8;
  string venue_name = 9;
  string venue_address = 10;
  // entry_fee_minor — null означает «взнос не задан» (публично не
  // показывается); 0 — участие бесплатное. Задан ⇒ entry_fee_currency
  // обязателен.
  optional int64 entry_fee_minor = 11;
  string entry_fee_currency = 12;
  // program — полная замена программы по дням (спека 0040, FR-14), тем же
  // приёмом, что contacts.
  repeated TournamentProgramDay program = 13;
  // notifications — глобальные переключатели уведомлений (спека 0042,
  // FR-19). Правится тем же экраном профиля, что и остальные поля.
  NotificationSettings notifications = 14;
}

// ContactInput — контакт при вводе (без id и без position; позиция
// определяется порядком в массиве).
message ContactInput {
  ContactType type = 1;
  string value = 2;
}

message UpdateActiveTournamentResponse {
  Tournament tournament = 1;
}

message UploadTournamentFileRequest {
  TournamentFileKind kind = 1;
  // content — файл целиком. Порог размера зависит от kind (FR-32) и
  // проверяется сервером; стриминг не нужен при разумных лимитах (PDF до
  // 10 МБ, картинка до 5 МБ).
  bytes content = 2;
  string file_name = 3;
  // content_type — заявленный загружающим MIME-тип. Только для ранней
  // отбраковки на BFF; итоговый тип сервер определяет по содержимому
  // файла (NFR-9), не по этому полю.
  string content_type = 4;
}

message UploadTournamentFileResponse {
  Tournament tournament = 1;
}

message DeleteTournamentFileRequest {
  TournamentFileKind kind = 1;
}

message DeleteTournamentFileResponse {
  Tournament tournament = 1;
}